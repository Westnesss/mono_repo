name: sistema-completo

services:
  # --- SERVICIOS DE CATÁLOGO ---
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-catalog_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-catalog_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  catalog-api:
    build:
      context: ./uce_bolierplate/uce
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/catalog-api:${IMAGE_TAG:-dev}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/${DB_NAME:-catalog_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  catalog-web:
    build:
      context: ./uce_bolierplate/uce
      dockerfile: docker/web.Dockerfile
    image: ${DOCKERHUB_USER:-local}/catalog-web:${IMAGE_TAG:-dev}
    # NOTA: Se eliminó la sección "ports:" para que no se exponga el 8080 hacia afuera
    depends_on:
      catalog-api:
        condition: service_healthy

  # --- SERVICIOS DE POKEDEX ---
  pokedex-web:
    build:
      context: ./pokedex
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/pokedex-web:${IMAGE_TAG:-dev}
    # NOTA: Se eliminó la sección "ports:" para que no se exponga el 8090 hacia afuera

  # --- API GATEWAY (Nginx Centralizador) ---
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Añadimos este volumen para que el Gateway pueda leer el frontend del catálogo:
      - ./uce_bolierplate/uce/src/main/resources/static:/usr/share/nginx/html
    depends_on:
      - catalog-web
      - pokedex-web

volumes:
  pgdata: